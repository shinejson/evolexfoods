<div class="shell">
  <aside>
    <div class="brand">
      <div class="mark">EV</div>
      <div>
        <strong>Evolex Hub</strong>
        <span>Digital operations</span>
      </div>
    </div>
    <nav>
      <ng-container *ngFor="let group of navGroups; let last = last">
        <a *ngFor="let item of group.items" [routerLink]="item.path" routerLinkActive="active">
          <span class="ico" [ngSwitch]="item.icon">
            <svg *ngSwitchCase="'hub'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
            <svg *ngSwitchCase="'ceo'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5h2v14H4zm4-8v8h3v-8H8zm5-5v13h3V6h-3zm5 8v5h3v-5h-3z"/></svg>
            <svg *ngSwitchCase="'livestock'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8c0-1.7 1.8-3 4-3s4 1.3 4 3c2.2 0 4 1.6 4 3.5S17.2 15 15 15H8c-2.2 0-4-1.6-4-3.5S5.8 8 8 8H7zm1 9v3m8-3v3M9 8V5m6 3V5"/></svg>
            <svg *ngSwitchCase="'health'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.5-8.2C.4 9.6 2.2 5 6.5 5 9 5 10.5 6.4 12 8.2 13.5 6.4 15 5 17.5 5c4.3 0 6.1 4.6 4 7.8C19 16.6 12 21 12 21z"/></svg>
            <svg *ngSwitchCase="'treatments'" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 3.5 10 5l-6 6-1.5-1.5 6-6zm2.1 1.1 9.2 9.2c.8.8.8 2 0 2.8l-2.1 2.1c-.8.8-2 .8-2.8 0l-9.2-9.2 4.9-4.9zM7 14l3 3"/></svg>
            <svg *ngSwitchCase="'breeding'" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm8 4a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM11 12l2 2"/></svg>
            <svg *ngSwitchCase="'feed'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9m0 0c4-6 8-6 8-6s0 6-8 6zm0 0C8 3 4 3 4 3s0 6 8 6z"/></svg>
            <svg *ngSwitchCase="'inventory'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7 12 3l9 4-9 4L3 7zm0 4 9 4 9-4M3 15l9 4 9-4"/></svg>
            <svg *ngSwitchCase="'procurement'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2.2 10h9.6L20 8H8m1 13a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
            <svg *ngSwitchCase="'suppliers'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16V8h11v8H3zm11 0h5l3 3v-7h-3l-2-3h-3v7zM7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
            <svg *ngSwitchCase="'assets'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11H4zm4-1v-6h8v6"/></svg>
            <svg *ngSwitchCase="'maintenance'" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L4 17l3 3 5.1-5.1a4 4 0 0 0 5.6-5.6L16 11l-3-3 1.7-1.7z"/></svg>
            <svg *ngSwitchCase="'people'" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm9-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3.3 3.1-6 7-6s7 2.7 7 6m1-6c2.9 0 5 2 5 4.5"/></svg>
            <svg *ngSwitchCase="'tasks'" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1.2 1.2L7.5 5M4 12l1.2 1.2L7.5 11M4 18l1.2 1.2L7.5 17"/></svg>
            <svg *ngSwitchCase="'expenses'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m4-14.5c0-1.7-1.8-3-4-3s-4 1.3-4 3 1.8 3 4 3 4 1.2 4 3-1.8 3-4 3-4-1.3-4-3"/></svg>
            <svg *ngSwitchCase="'invoices'" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5V3zm3 5h4M10 12h4M10 16h2"/></svg>
            <svg *ngSwitchCase="'crm'" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V8l9-5 9 5v12H3zm5-1v-6h8v6"/></svg>
            <svg *ngSwitchCase="'deals'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z"/></svg>
            <svg *ngSwitchCase="'marketing'" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l7 4V5L8 9H4zm15 1.5a4 4 0 0 1 0 3"/></svg>
            <svg *ngSwitchCase="'risks'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3zm0 6v6m0 3h.01"/></svg>
            <svg *ngSwitchCase="'decisions'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 8h10M8 16h8M4 12h16"/></svg>
            <svg *ngSwitchCase="'sops'" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h9l3 3v13H6V4zm3 6h6M9 14h6M9 18h4"/></svg>
          </span>
          <span>{{ item.label }}</span>
        </a>
        <hr *ngIf="!last" class="nav-line" />
      </ng-container>
    </nav>
  </aside>
  <div class="main">
    <header>
      <div>
        <div class="eyebrow">Management visibility layer</div>
        <div class="who">{{ auth.user?.name }} · {{ auth.user?.role }}</div>
      </div>
      <button class="btn ghost" (click)="auth.logout()">Sign out</button>
    </header>
    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
