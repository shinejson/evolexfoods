<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4A32"/>
      <stop offset="45%" stop-color="#233B26"/>
      <stop offset="100%" stop-color="#142416"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8C6208"/>
    </linearGradient>

    <!-- Fresh Sprout Green Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5D7A4D"/>
      <stop offset="50%" stop-color="#7BB661"/>
      <stop offset="100%" stop-color="#A8E063"/>
    </linearGradient>

    <!-- Emerald Leaf Accent -->
    <linearGradient id="emeraldGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#275635"/>
      <stop offset="100%" stop-color="#529960"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5D7A4D" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2F4A32" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#142416" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#070f08" flood-opacity="0.45"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Shield Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Internal Radial Glow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#centerGlow)"/>

  <!-- Luxury Gold Border Trim -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" opacity="0.85"/>
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(212, 175, 55, 0.22)" stroke-width="1.5"/>

  <!-- Geometric Horizon / Circular Halo -->
  <circle cx="256" cy="246" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="256" cy="246" r="162" fill="none" stroke="rgba(244, 239, 228, 0.15)" stroke-width="1"/>

  <!-- Central Emblem Group -->
  <g id="emblem" transform="translate(0, 4)">

    <!-- Stylized Livestock Horns Arch (Sweeping upward elegance) -->
    <path d="M 148 240 C 138 190, 154 134, 202 110 C 218 102, 232 108, 226 126 C 218 152, 204 186, 218 226 C 224 244, 212 254, 198 252 C 176 250, 158 248, 148 240 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>
    
    <path d="M 364 240 C 374 190, 358 134, 310 110 C 294 102, 280 108, 286 126 C 294 152, 308 186, 294 226 C 288 244, 300 254, 314 252 C 336 250, 354 248, 364 240 Z" 
          fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Dynamic Livestock Head & Shield Form -->
    <path d="M 256 160 C 220 185, 206 220, 208 266 C 210 316, 240 354, 256 376 C 272 354, 302 316, 304 266 C 306 220, 292 185, 256 160 Z" 
          fill="#1C2E1F" stroke="url(#goldGrad)" stroke-width="3.5"/>

    <!-- Central Agricultural Sprout (Rising from within) -->
    <!-- Left Leaf -->
    <path d="M 256 295 C 236 270, 215 240, 225 198 C 248 214, 255 245, 256 295 Z" 
          fill="url(#sproutGrad)"/>
    
    <!-- Right Leaf -->
    <path d="M 256 295 C 276 270, 297 240, 287 198 C 264 214, 257 245, 256 295 Z" 
          fill="url(#emeraldGrad)"/>

    <!-- Central Sprout Stem / Wheat Spine -->
    <path d="M 256 150 L 256 345" 
          stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Wheat Kernel Accents (Harvest Gold) -->
    <ellipse cx="256" cy="144" rx="7" ry="14" fill="url(#goldGrad)"/>
    <ellipse cx="242" cy="168" rx="6" ry="11" transform="rotate(-28 242 168)" fill="url(#goldGrad)"/>
    <ellipse cx="270" cy="168" rx="6" ry="11" transform="rotate(28 270 168)" fill="url(#goldGrad)"/>
    <ellipse cx="238" cy="196" rx="5.5" ry="10" transform="rotate(-35 238 196)" fill="url(#goldGrad)" opacity="0.85"/>
    <ellipse cx="274" cy="196" rx="5.5" ry="10" transform="rotate(35 274 196)" fill="url(#goldGrad)" opacity="0.85"/>

    <!-- Diamond Base Accent -->
    <polygon points="256,388 265,398 256,408 247,398" fill="url(#goldGrad)"/>

    <!-- Geometric "EV" Monogram Bar Accent -->
    <path d="M 230 330 L 282 330" stroke="#F4EFE4" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Modern Clean Baseline Wordmark (EVOLEX) -->
  <text x="256" y="454" 
        text-anchor="middle" 
        font-family="'Fraunces', 'Cinzel', 'Georgia', serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="9" 
        fill="url(#goldGrad)">EVOLEX</text>
</svg>
