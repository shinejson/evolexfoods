<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="lf_bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4A32"/>
      <stop offset="60%" stop-color="#223925"/>
      <stop offset="100%" stop-color="#142316"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="lf_goldGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EEDC9A"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8C6208"/>
    </linearGradient>

    <!-- Fresh Sprout Green Gradient -->
    <linearGradient id="lf_sproutGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#5D7A4D"/>
      <stop offset="50%" stop-color="#7BB661"/>
      <stop offset="100%" stop-color="#9DE05B"/>
    </linearGradient>

    <!-- Emerald Leaf Accent -->
    <linearGradient id="lf_emeraldGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#275635"/>
      <stop offset="100%" stop-color="#529960"/>
    </linearGradient>

    <filter id="lf_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#070f08" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ─── ICON MARK (Left: 130x130 centered in 150 height) ─── -->
  <g transform="translate(10, 10)">
    <!-- Shield Box -->
    <rect x="0" y="0" width="130" height="130" rx="32" fill="url(#lf_bgGrad)" filter="url(#lf_shadow)"/>
    <rect x="0" y="0" width="130" height="130" rx="32" fill="none" stroke="url(#lf_goldGrad)" stroke-width="2.5"/>
    <rect x="4" y="4" width="122" height="122" rx="28" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="1"/>

    <!-- Subtle Aura Circle -->
    <circle cx="65" cy="65" r="46" fill="none" stroke="url(#lf_goldGrad)" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>

    <!-- Mini Livestock & Sprout Emblem Group -->
    <g transform="translate(65, 63) scale(0.28) translate(-256, -250)">
      <!-- Livestock Horns -->
      <path d="M 148 240 C 138 190, 154 134, 202 110 C 218 102, 232 108, 226 126 C 218 152, 204 186, 218 226 C 224 244, 212 254, 198 252 C 176 250, 158 248, 148 240 Z" fill="url(#lf_goldGrad)"/>
      <path d="M 364 240 C 374 190, 358 134, 310 110 C 294 102, 280 108, 286 126 C 294 152, 308 186, 294 226 C 288 244, 300 254, 314 252 C 336 250, 354 248, 364 240 Z" fill="url(#lf_goldGrad)"/>

      <!-- Central Shield -->
      <path d="M 256 160 C 220 185, 206 220, 208 266 C 210 316, 240 354, 256 376 C 272 354, 302 316, 304 266 C 306 220, 292 185, 256 160 Z" fill="#182A1B" stroke="url(#lf_goldGrad)" stroke-width="6"/>

      <!-- Leaves -->
      <path d="M 256 295 C 236 270, 215 240, 225 198 C 248 214, 255 245, 256 295 Z" fill="url(#lf_sproutGrad)"/>
      <path d="M 256 295 C 276 270, 297 240, 287 198 C 264 214, 257 245, 256 295 Z" fill="url(#lf_emeraldGrad)"/>

      <!-- Spine & Wheat -->
      <path d="M 256 145 L 256 345" stroke="url(#lf_goldGrad)" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="256" cy="140" rx="9" ry="16" fill="url(#lf_goldGrad)"/>
      <ellipse cx="238" cy="168" rx="8" ry="14" transform="rotate(-30 238 168)" fill="url(#lf_goldGrad)"/>
      <ellipse cx="274" cy="168" rx="8" ry="14" transform="rotate(30 274 168)" fill="url(#lf_goldGrad)"/>
    </g>
  </g>

  <!-- ─── TYPOGRAPHY (Right) ─── -->
  <g transform="translate(165, 0)">
    <!-- Primary Brand Wordmark: EVOLEX -->
    <text x="0" y="72" 
          font-family="'Fraunces', 'Cinzel', 'Playfair Display', 'Georgia', serif" 
          font-size="54" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#1E3321">EVOLEX</text>

    <!-- Secondary Wordmark: FOOD HUB -->
    <text x="245" y="72" 
          font-family="'Manrope', 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="6" 
          fill="#5D7A4D">FOOD HUB</text>

    <!-- Golden Divider Line -->
    <line x1="2" y1="92" x2="480" y2="92" stroke="url(#lf_goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Accent Diamond on Divider -->
    <polygon points="170,92 175,88 180,92 175,96" fill="#B8860B"/>

    <!-- Tagline: PRECISION LIVESTOCK & AGRO-FOOD ENTERPRISE -->
    <text x="2" y="118" 
          font-family="'Manrope', 'Inter', sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="3.5" 
          fill="#667085">PRECISION LIVESTOCK &amp; AGRI OPERATIONS</text>
  </g>
</svg>
